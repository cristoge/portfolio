<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chequeo diario</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap');

  :root{
    --paper: #EAE6D9;
    --paper-raised: #F2EFE4;
    --ink: #2A2820;
    --ink-soft: #6E695B;
    --line: #D2CBB6;
    --forest: #3E5245;
    --forest-dim: #4E6858;
    --rust: #8B4A38;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
  }

  .page{
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 24px 110px;
  }

  .kicker{
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }

  h1{
    font-size: 30px;
    font-weight: 600;
    line-height: 1.15;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  .sub{
    font-size: 16px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0 0 30px;
    max-width: 52ch;
  }

  /* Settings: date + vault path */
  .settings{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px 16px 18px;
    margin-bottom: 34px;
  }

  .field{
    margin-bottom: 14px;
  }
  .field:last-child{ margin-bottom: 0; }

  .field-label{
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .date-field-row{
    display: flex;
    align-items: center;
    gap: 12px;
  }

  input[type="date"]{
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 10px;
    outline: none;
  }
  input[type="date"]:focus{ border-color: var(--forest); }

  .date-display{
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--forest);
  }

  input[type="text"].path-input{
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 9px 11px;
    outline: none;
  }
  input[type="text"].path-input:focus{ border-color: var(--forest); }
  input[type="text"].path-input::placeholder{ color: #A8A290; font-style: italic; }

  .subhead{
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--forest);
    margin: 0 0 4px;
  }
  .subhead-note{
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }

  section.block{
    margin-bottom: 34px;
  }

  /* Levers checklist */
  .lever-row{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .lever-row input[type="checkbox"]{
    width: 18px; height: 18px;
    accent-color: var(--forest);
    flex-shrink: 0;
    cursor: pointer;
  }
  .lever-row input[type="text"]{
    flex: 1;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 9px 11px;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 15px;
    color: var(--ink);
    outline: none;
  }
  .lever-row input[type="text"]:focus{ border-color: var(--forest); }
  .lever-row.done input[type="text"]{
    color: var(--ink-soft);
    text-decoration: line-through;
  }
  .lever-row .remove{
    appearance: none;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
    flex-shrink: 0;
  }
  .lever-row .remove:hover{ color: var(--rust); }

  .add-lever{
    appearance: none;
    background: none;
    border: 1px dashed var(--line);
    border-radius: 3px;
    width: 100%;
    padding: 9px 11px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    text-align: left;
  }
  .add-lever:hover{ border-color: var(--forest-dim); color: var(--forest-dim); }

  /* Prompt items */
  .item{
    padding-left: 14px;
    border-left: 2px solid var(--line);
    margin-bottom: 22px;
  }
  .item label{
    display: block;
    font-size: 16px;
    line-height: 1.45;
    margin-bottom: 9px;
  }
  .item textarea{
    width: 100%;
    min-height: 56px;
    resize: vertical;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 11px 13px;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink);
    outline: none;
  }
  .item textarea:focus{ border-color: var(--forest); }
  .item textarea::placeholder{ color: #A8A290; font-style: italic; }

  .export-btn{
    appearance: none;
    width: 100%;
    background: var(--forest);
    color: var(--paper-raised);
    border: none;
    border-radius: 5px;
    padding: 13px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 6px;
  }
  .export-btn:hover{ background: var(--forest-dim); }

  footer.status{
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, var(--paper) 60%, transparent);
    padding: 22px 24px 16px;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }
  .status-pill{
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    padding: 7px 14px;
    border-radius: 20px;
    pointer-events: auto;
  }
  .status-pill .dot{
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--forest);
    margin-right: 7px;
    position: relative; top: -1px;
  }

  @media (max-width: 480px){
    .page{ padding: 36px 16px 110px; }
    h1{ font-size: 26px; }
  }
</style>
</head>
<body>

<div class="page">

  <p class="kicker">Chequeo diario</p>
  <h1>Hoy</h1>
  <p class="sub">Marca tus palancas y responde tres preguntas cortas — mañana, mediodía y noche. Cuando termines, descarga el día en Markdown y muévelo a tu vault.</p>


  <div class="settings">
    <div class="field">
      <span class="field-label">Día</span>
      <div class="date-field-row">
        <input type="date" id="date-picker">
        <span class="date-display" id="date-display">—</span>
      </div>
    </div>
  </div>

  <section class="block">
    <p class="subhead">Palancas de hoy</p>
    <p class="subhead-note">Las 2 o 3 acciones concretas que quieres asegurarte de hacer hoy.</p>
    <div id="levers-list"></div>
    <button class="add-lever" id="add-lever">+ añadir palanca</button>
  </section>

  <section class="block">
    <p class="subhead">Mañana</p>
    <div class="item">
      <label>¿Qué puedo hacer hoy que me acerque a la vida que quiero?</label>
      <textarea data-key="morning" placeholder="Escribe aquí..."></textarea>
    </div>
  </section>

  <section class="block">
    <p class="subhead">Mediodía</p>
    <div class="item">
      <label>¿Hay algo que llevo horas evitando hacer?</label>
      <textarea data-key="midday" placeholder="Escribe aquí..."></textarea>
    </div>
  </section>

  <section class="block">
    <p class="subhead">Noche</p>
    <div class="item">
      <label>¿En qué momento del día me sentí más animado?</label>
      <textarea data-key="evening1" placeholder="Escribe aquí..."></textarea>
    </div>
    <div class="item">
      <label>¿En qué momento me sentí más apagado o desganado?</label>
      <textarea data-key="evening2" placeholder="Escribe aquí..."></textarea>
    </div>
    <div class="item">
      <label>¿Hice algo hoy solo por quedar bien o por miedo, y no porque de verdad quisiera hacerlo?</label>
      <textarea data-key="evening3" placeholder="Escribe aquí..."></textarea>
    </div>
  </section>

  <button class="export-btn" id="export-md">Descargar en Markdown</button>

</div>

<footer class="status">
  <span class="status-pill"><span class="dot"></span><span id="status-text">Cargando...</span></span>
</footer>

<script>
  // Ruta absoluta de tu carpeta en el vault. Cámbiala por la tuya.
  const VAULT_PATH = "/home/ejemplo/vault/Diario/Chequeos";

  const TEMPLATE_KEY = 'chequeo-palancas-plantilla';
  const DAY_KEY_PREFIX = 'chequeo-dia:';

  const statusText = document.getElementById('status-text');
  const datePicker = document.getElementById('date-picker');
  const dateDisplay = document.getElementById('date-display');
  const leversListEl = document.getElementById('levers-list');

  let currentDate = new Date();
  let leversTemplate = ['', '', ''];
  let dayCache = {};
  let saveTimer = null;

  function toISODate(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function toDDMMYYYY(d){
    return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
  }

  function setStatus(text){ statusText.textContent = text; }

  async function loadTemplate(){
    try{
      const r = await window.storage.get(TEMPLATE_KEY, false);
      if(r && r.value) leversTemplate = JSON.parse(r.value);
    }catch(e){}
  }

  async function loadDay(iso){
    if(dayCache[iso]) return dayCache[iso];
    try{
      const r = await window.storage.get(DAY_KEY_PREFIX + iso, false);
      if(r && r.value){
        dayCache[iso] = JSON.parse(r.value);
        return dayCache[iso];
      }
    }catch(e){}
    const fresh = {
      levers: leversTemplate.map(t => ({ text: t, done: false })),
      morning: '', midday: '', evening1: '', evening2: '', evening3: ''
    };
    dayCache[iso] = fresh;
    return fresh;
  }

  function scheduleSaveDay(iso){
    setStatus('Guardando...');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try{
        await window.storage.set(DAY_KEY_PREFIX + iso, JSON.stringify(dayCache[iso]), false);
        setStatus('Guardado');
      }catch(e){
        setStatus('No se pudo guardar');
      }
    }, 450);
  }

  function renderLevers(entry, iso){
    leversListEl.innerHTML = '';
    entry.levers.forEach((lever, idx) => {
      const row = document.createElement('div');
      row.className = 'lever-row' + (lever.done ? ' done' : '');

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = lever.done;
      cb.addEventListener('change', () => {
        entry.levers[idx].done = cb.checked;
        row.classList.toggle('done', cb.checked);
        scheduleSaveDay(iso);
      });

      const txt = document.createElement('input');
      txt.type = 'text';
      txt.placeholder = 'Escribe una palanca...';
      txt.value = lever.text;
      txt.addEventListener('input', () => {
        entry.levers[idx].text = txt.value;
        scheduleSaveDay(iso);
      });

      const rm = document.createElement('button');
      rm.className = 'remove';
      rm.textContent = '×';
      rm.addEventListener('click', () => {
        entry.levers.splice(idx, 1);
        renderLevers(entry, iso);
        scheduleSaveDay(iso);
      });

      row.appendChild(cb);
      row.appendChild(txt);
      row.appendChild(rm);
      leversListEl.appendChild(row);
    });
  }

  async function renderDay(){
    const iso = toISODate(currentDate);
    datePicker.value = iso;
    dateDisplay.textContent = toDDMMYYYY(currentDate);
    setStatus('Cargando...');
    const entry = await loadDay(iso);

    renderLevers(entry, iso);

    document.querySelectorAll('textarea[data-key]').forEach(el => {
      const key = el.getAttribute('data-key');
      el.value = entry[key] || '';
      el.oninput = () => {
        entry[key] = el.value;
        scheduleSaveDay(iso);
      };
    });

    setStatus('Guardado automáticamente');
  }

  datePicker.addEventListener('change', () => {
    const [y, m, d] = datePicker.value.split('-').map(Number);
    currentDate = new Date(y, m - 1, d);
    renderDay();
  });

  document.getElementById('add-lever').addEventListener('click', async () => {
    const iso = toISODate(currentDate);
    const entry = await loadDay(iso);
    entry.levers.push({ text: '', done: false });
    renderLevers(entry, iso);
    scheduleSaveDay(iso);
  });

  function buildMarkdown(entry, ddmmyyyy, path){
    const leverLines = entry.levers
      .filter(l => l.text && l.text.trim())
      .map(l => `- [${l.done ? 'x' : ' '}] ${l.text.trim()}`)
      .join('\n') || '- (sin palancas registradas)';

    return `---
fecha: ${ddmmyyyy}
ruta_vault: ${path || '(sin definir)'}
---

# Chequeo diario — ${ddmmyyyy}

## Palancas
${leverLines}

## Mañana
**¿Qué puedo hacer hoy que me acerque a la vida que quiero?**
${entry.morning || '(sin respuesta)'}

## Mediodía
**¿Hay algo que llevo horas evitando hacer?**
${entry.midday || '(sin respuesta)'}

## Noche
**¿En qué momento del día me sentí más animado?**
${entry.evening1 || '(sin respuesta)'}

**¿En qué momento me sentí más apagado o desganado?**
${entry.evening2 || '(sin respuesta)'}

**¿Hice algo hoy solo por quedar bien o por miedo, y no porque de verdad quisiera hacerlo?**
${entry.evening3 || '(sin respuesta)'}
`;
  }

  document.getElementById('export-md').addEventListener('click', async () => {
    const iso = toISODate(currentDate);
    const entry = await loadDay(iso);
    const ddmmyyyy = toDDMMYYYY(currentDate);
    const md = buildMarkdown(entry, ddmmyyyy, VAULT_PATH);
    const filename = ddmmyyyy.replaceAll('/', '-') + '.md';

    const blob = new Blob([md], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  (async function init(){
    await loadTemplate();
    await renderDay();
  })();
</script>

</body>
</html>
